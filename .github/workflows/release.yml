name: Release

# Runs only when a version tag such as v0.1.0 is pushed, or when started by hand from the Actions tab.
# Nothing here is scheduled. Started by hand, it releases the current mod_version and creates its tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "Missing release notes docs/releases/v$version.md"
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      # Fabric Loom needs JDK 25 to run Gradle; the 1.21.11 jar is still compiled for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: GentleUI ${{ env.TAG }}
          body_path: docs/releases/${{ env.TAG }}.md
          files: |
            fabric/1.21.11/build/libs/gentleui-fabric-1.21.11-*.jar
            fabric/26.3/build/libs/gentleui-fabric-26.3-*.jar
