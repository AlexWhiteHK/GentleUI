name: Release

# Runs only when a version tag such as v0.1.0 is pushed; nothing here is scheduled.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version in gradle.properties"
            exit 1
          fi

      # Fabric Loom needs JDK 25 to run Gradle; the 1.21.11 jar is still compiled for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: GentleUI ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            fabric/1.21.11/build/libs/gentleui-fabric-1.21.11-*.jar
            fabric/26.3/build/libs/gentleui-fabric-26.3-*.jar
