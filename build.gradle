plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	group = project.maven_group
	version = project.mod_version

	plugins.withType(JavaPlugin).configureEach {
		// Bytecode targets Java 21 so the same classes run on 1.21.x (Java 21) and 26.x (Java 25+).
		// Any JDK >= 21 can compile this; Loom itself needs Gradle to run on JDK 25.
		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = 21
		}
	}
}
